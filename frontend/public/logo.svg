<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Shadow -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="112" 
    fill="url(#bgGrad)" 
    filter="url(#softShadow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect 
    x="34" 
    y="34" 
    width="444" 
    height="444" 
    rx="110" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="3" 
    stroke-opacity="0.25"
  />

  <!-- Decorative Top Right Glow Circle -->
  <circle cx="400" cy="110" r="70" fill="#34d399" opacity="0.18" filter="url(#glow)" />

  <!-- Logo Graphics Group -->
  <g transform="translate(0, 4)">
    <!-- Storefront Canopy / Awning -->
    <path 
      d="M136 190 L160 142 C164 134 172 130 180 130 L332 130 C340 130 348 134 352 142 L376 190 Z" 
      fill="url(#accentGrad)" 
      opacity="0.95"
    />
    
    <!-- Canopy Stripes / Detail -->
    <path d="M190 130 L180 190" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.35" />
    <path d="M234 130 L230 190" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.35" />
    <path d="M278 130 L282 190" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.35" />
    <path d="M322 130 L332 190" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.35" />

    <!-- Canopy Scalloped Valance / Bottom Edge -->
    <path 
      d="M136 190 Q152 206 168 190 Q184 206 200 190 Q216 206 232 190 Q256 208 280 190 Q296 206 312 190 Q328 206 344 190 Q360 206 376 190" 
      fill="none" 
      stroke="url(#accentGrad)" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Main Store Body / Shopping Bag Base -->
    <rect 
      x="152" 
      y="204" 
      width="208" 
      height="172" 
      rx="24" 
      fill="#ffffff" 
      opacity="0.98"
    />

    <!-- Shopping Door / Portal -->
    <path 
      d="M224 376 L224 286 C224 268 288 268 288 286 L288 376 Z" 
      fill="url(#bgGrad)"
    />

    <!-- Shopping Bag Handle on Store Roof -->
    <path 
      d="M214 130 C214 96 298 96 298 130" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="12" 
      stroke-linecap="round"
    />

    <!-- Smart Inventory Tech Badge (Letter 'S' + Dynamic Growth / Barcode Node) -->
    <!-- Golden Star / Sparkle of Quality in Upper Corner -->
    <path 
      d="M345 220 L350 234 L364 239 L350 244 L345 258 L340 244 L326 239 L340 234 Z" 
      fill="url(#goldAccent)"
    />

    <!-- Speed / Smart OS Accent lines on side -->
    <line x1="172" y1="240" x2="204" y2="240" stroke="#059669" stroke-width="6" stroke-linecap="round" />
    <line x1="172" y1="260" x2="196" y2="260" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <line x1="172" y1="280" x2="200" y2="280" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
